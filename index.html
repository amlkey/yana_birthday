<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днём рождения, Яна! 🎂</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Класс для блокировки скролла при открытой модалке */
        body.no-scroll {
            overflow: hidden;
        }

        .main-site {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 1;
            display: flex; justify-content: center; align-items: center;
        }

        .bg-glow {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(255,105,180,0.06) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes rotateGlow {
            from { transform: rotate(0deg); } to { transform: rotate(360deg); }
        }

        /* Заставка 3D */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 100%);
            z-index: 500;
            display: flex; justify-content: center; align-items: center;
            animation: fadeOutSplash 0.8s ease 4.5s forwards;
            perspective: 1000px;
        }
        @keyframes fadeOutSplash {
            to { opacity: 0; pointer-events: none; }
        }
        .splash-content {
            text-align: center; transform-style: preserve-3d;
            animation: float3d 3s ease-in-out infinite;
        }
        @keyframes float3d {
            0%, 100% { transform: rotateY(0deg) rotateX(0deg) translateZ(0); }
            25% { transform: rotateY(8deg) rotateX(3deg) translateZ(40px); }
            50% { transform: rotateY(0deg) rotateX(0deg) translateZ(0); }
            75% { transform: rotateY(-8deg) rotateX(-3deg) translateZ(40px); }
        }
        .splash-age {
            font-size: 8em; font-weight: 900;
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 50%, #ff6b9d 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 60px rgba(255,215,0,0.6)) drop-shadow(0 0 120px rgba(255,105,180,0.4));
            animation: pulseNumber 1.5s ease-in-out infinite; line-height: 1;
        }
        @keyframes pulseNumber {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 60px rgba(255,215,0,0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 100px rgba(255,215,0,0.9)); }
        }
        .splash-name {
            font-size: 4em; font-weight: 700; color: white;
            text-shadow: 0 0 40px rgba(255,255,255,0.5), 0 0 80px rgba(255,105,180,0.4);
            margin-top: 10px; animation: shimmerText 2s infinite;
        }
        @keyframes shimmerText {
            0%, 100% { text-shadow: 0 0 40px rgba(255,255,255,0.5); }
            50% { text-shadow: 0 0 80px rgba(255,255,255,0.8), 0 0 120px rgba(255,215,0,0.6); }
        }
        .splash-sub {
            color: rgba(255,255,255,0.6); font-size: 1.3em;
            letter-spacing: 4px; margin-top: 20px; text-transform: uppercase;
        }

        .firework { position: fixed; pointer-events: none; z-index: 501; }
        .firework-particle {
            position: absolute; width: 6px; height: 6px;
            border-radius: 50%; animation: explode 1.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* Шары */
        .balloons-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .balloon {
            position: absolute; bottom: -200px;
            animation: floatBalloon 12s infinite ease-in;
        }
        .balloon-body {
            width: 70px; height: 90px; border-radius: 50%; position: relative;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.3);
        }
        .balloon-body::after {
            content: ''; position: absolute; bottom: -15px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-top: 15px solid; border-top-color: inherit;
        }
        .balloon-string {
            width: 2px; height: 80px; background: rgba(255,255,255,0.4);
            margin: 0 auto; border-radius: 1px;
            animation: swayString 3s infinite ease-in-out;
        }
        @keyframes floatBalloon {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-110vh) translateX(80px) rotate(15deg); opacity: 0; }
        }
        @keyframes swayString {
            0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); }
        }

        /* Контент */
        .main-container {
            position: relative; z-index: 1; width: 100%; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }
        .title-block { text-align: center; margin-bottom: 40px; }
        .age-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b9d, #ff3d7f);
            color: white; padding: 8px 20px; border-radius: 50px;
            font-size: 1em; font-weight: 600; letter-spacing: 2px; margin-bottom: 15px;
        }
        .main-title {
            font-size: 3em; font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffa07a, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: shimmer 3s infinite; line-height: 1.2;
        }
        @keyframes shimmer {
            0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); }
        }
        .subtitle {
            color: rgba(255,255,255,0.7); font-size: 1.1em;
            margin-top: 10px; letter-spacing: 1px;
        }
        .choice-section { text-align: center; width: 100%; max-width: 600px; }
        .choice-question {
            color: #ffd700; font-size: 1.3em; margin-bottom: 30px;
            letter-spacing: 2px; font-weight: 300; text-transform: uppercase;
        }
        .options {
            display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;
        }
        .option-btn {
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 30px 25px;
            cursor: pointer; transition: all 0.4s ease;
            color: white; font-size: 1.2em; font-weight: 500;
            flex: 1; min-width: 220px; max-width: 300px;
            position: relative; overflow: hidden;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .option-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s;
        }
        .option-btn:hover::before { left: 100%; }
        .option-btn:hover {
            background: rgba(255,255,255,0.12); border-color: #ff6b9d;
            transform: translateY(-8px); box-shadow: 0 20px 50px rgba(255,105,180,0.2);
        }
        .option-btn .btn-icon { font-size: 45px; display: block; margin-bottom: 12px; }
        .option-btn .btn-label { font-weight: 500; letter-spacing: 1px; }

        /* Модальное окно */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 600;
            justify-content: center; align-items: center;
            animation: fadeInModal 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeInModal {
            from { opacity: 0; } to { opacity: 1; }
        }
        .modal {
            background: linear-gradient(145deg, #1e1e3a, #2a1a3a);
            border-radius: 30px; padding: 40px 30px; text-align: center;
            max-width: 550px; width: 90%;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 70px; margin-bottom: 10px; }
        .modal-title { color: #ffd700; font-size: 1.6em; margin: 15px 0; font-weight: 600; line-height: 1.4; }
        .certificate-code {
            background: rgba(0,0,0,0.5); border: 2px dashed #ffd700;
            border-radius: 15px; padding: 20px; margin: 20px 0;
            font-size: 1.6em; letter-spacing: 4px; color: #ffd700;
            font-family: 'Courier New', monospace; word-break: break-all;
            animation: glowPulse 2s infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.2); }
            50% { box-shadow: 0 0 45px rgba(255,215,0,0.5); }
        }
        .certificate-image {
            max-width: 100%;
            max-height: 60vh; /* Чтобы на телефоне не уходила за экран */
            height: auto;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid rgba(255,215,0,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            object-fit: contain;
        }
        .joke-frame {
            background: rgba(255,105,180,0.08); border: 2px solid #ff6b9d;
            border-radius: 20px; padding: 25px; margin: 20px 0;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); } 75% { transform: translateX(10px); }
        }
        .joke-text { color: #ff6b9d; font-size: 1.3em; font-weight: 600; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .close-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 14px 30px; border-radius: 50px;
            font-size: 1em; cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .close-btn:hover { background: rgba(255,255,255,0.18); transform: scale(1.05); }
        .continue-btn {
            background: rgba(255,105,180,0.2); border: 1px solid #ff6b9d;
            color: #ff6b9d; padding: 14px 30px; border-radius: 50px;
            font-size: 1em; cursor: pointer; transition: all 0.3s;
            letter-spacing: 1px; font-weight: 600;
        }
        .continue-btn:hover { background: rgba(255,105,180,0.35); transform: scale(1.05); }
        .final-list {
            text-align: left; display: inline-block; margin: 15px 0;
            color: rgba(255,255,255,0.8); line-height: 2; font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .splash-age { font-size: 5em; }
            .splash-name { font-size: 2.5em; }
            .main-title { font-size: 2em; }
            .options { flex-direction: column; align-items: center; }
            .option-btn { max-width: 100%; width: 100%; min-width: unset; }
            .choice-question { font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <div class="main-site" id="mainSite">
        <div class="bg-glow"></div>
        <div class="balloons-container" id="balloonsContainer"></div>

        <!-- Заставка 3D -->
        <div class="splash-screen" id="splashScreen">
            <div class="splash-content">
                <div class="splash-age">25</div>
                <div class="splash-name">Яна</div>
                <div class="splash-sub">С днём рождения!</div>
            </div>
        </div>

        <div class="main-container">
            <div class="title-block">
                <div class="age-badge">✨ 25 лет ✨</div>
                <h1 class="main-title">С днём рождения,<br>Яна!</h1>
                <p class="subtitle">Я подготовил кое-что особенное для тебя...</p>
            </div>
            <div class="choice-section">
                <p class="choice-question" id="choiceQuestion">Что ты выбираешь?</p>
                <div class="options" id="optionsContainer">
                    <button class="option-btn" onclick="showGift('goldApple')">
                        <span class="btn-icon">💄</span>
                        <span class="btn-label">Сертификат в Золотое Яблоко</span>
                    </button>
                    <button class="option-btn" onclick="startRoseQuest()">
                        <span class="btn-icon">🌹</span>
                        <span class="btn-label">51 роза</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        // ============ ФЕЙЕРВЕРКИ ============
        function launchSplashFirework(x, y) {
            const container = document.getElementById('splashScreen');
            const colors = ['#ffd700', '#ff6b9d', '#ff4500', '#ff1493', '#ffa500', '#ff69b4', '#ffff00', '#00ffff'];
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.style.position = 'absolute';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.setProperty('--dx', (Math.random() - 0.5) * 300 + 'px');
                particle.style.setProperty('--dy', (Math.random() - 0.5) * 300 + 'px');
                particle.style.width = (Math.random() * 8 + 3) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (Math.random() * 1 + 1) + 's';
                particle.style.animationDelay = Math.random() * 0.3 + 's';
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
        }

        function startSplashFireworks() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const spots = [
                { x: w * 0.3, y: h * 0.3, delay: 0 },
                { x: w * 0.7, y: h * 0.2, delay: 600 },
                { x: w * 0.5, y: h * 0.5, delay: 1200 },
                { x: w * 0.2, y: h * 0.6, delay: 1800 },
                { x: w * 0.8, y: h * 0.5, delay: 2400 },
                { x: w * 0.4, y: h * 0.7, delay: 3000 },
                { x: w * 0.6, y: h * 0.3, delay: 3500 },
            ];
            spots.forEach(spot => {
                setTimeout(() => launchSplashFirework(spot.x, spot.y), spot.delay);
            });
        }

        // ============ ШАРЫ ============
        function createBalloons() {
            const container = document.getElementById('balloonsContainer');
            const colors = ['#ff6b9d', '#ffd700', '#ff8c69', '#ff69b4', '#ffa07a', '#ff1493', '#ffb6c1', '#ff4500', '#da70d6', '#f0e68c'];
            for (let i = 0; i < 15; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 90 + '%';
                balloon.style.animationDelay = Math.random() * 12 + 's';
                balloon.style.animationDuration = (Math.random() * 8 + 10) + 's';
                const body = document.createElement('div');
                body.className = 'balloon-body';
                const color = colors[Math.floor(Math.random() * colors.length)];
                body.style.background = `radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), ${color} 70%)`;
                body.style.setProperty('border-top-color', color);
                const string = document.createElement('div');
                string.className = 'balloon-string';
                string.style.animationDelay = Math.random() * 3 + 's';
                balloon.appendChild(body);
                balloon.appendChild(string);
                container.appendChild(balloon);
            }
        }

        // ============ КВЕСТ С РОЗАМИ ============
        const roseQuestSteps = [
            { icon: '🌹', title: 'Ты уверена?', text: 'Может, всё-таки посмотришь на сертификаты? Там много всего интересного...', btnYes: 'Да, хочу розы!', btnNo: 'Покажи сертификаты' },
            { icon: '🤔', title: 'Может, передумаешь?', text: 'Сертификаты не кусаются! А розы... ну, они завянут через неделю.', btnYes: 'Всё равно хочу розы!', btnNo: 'Ладно, уговорил' },
            { icon: '😅', title: 'Ну подумай ещё...', text: 'Последний шанс! Сертификат в Золотое Яблоко, маникюр, OZON, Wildberries... Или розы?', btnYes: 'РОЗЫ!!!', btnNo: 'Хорошо, давай сертификат' },
            { icon: '😄', title: 'Серьёзно?', text: 'Ты очень настойчивая! Но я тебя всё равно люблю.', btnYes: 'Да, я настойчивая!', btnNo: 'Сдаюсь, показывай подарки' },
        ];

        let currentRoseStep = 0;

        function startRoseQuest() {
            currentRoseStep = 0; // Исправлено: всегда начинаем с 0
            showRoseStep();
        }

        function showRoseStep() {
            const modalContent = document.getElementById('modalContent');
            const overlay = document.getElementById('modalOverlay');
            if (currentRoseStep < roseQuestSteps.length) {
                const step = roseQuestSteps[currentRoseStep];
                modalContent.innerHTML = `
                    <div class="modal-icon">${step.icon}</div>
                    <div class="modal-title">${step.title}</div>
                    <div class="joke-frame"><p class="joke-text">${step.text}</p></div>
                    <div class="modal-buttons">
                        <button class="continue-btn" onclick="continueRoseQuest()">${step.btnYes}</button>
                        <button class="close-btn" onclick="giveUpRoses()">${step.btnNo}</button>
                    </div>`;
            } else {
                modalContent.innerHTML = `
                    <div class="modal-icon">😆</div>
                    <div class="modal-title">Розы — это классно!</div>
                    <div class="joke-frame">
                        <p class="joke-text">Но не сегодня! 🌹😄</p>
                        <p style="color: rgba(255,255,255,0.6); margin-top: 10px;">Попробуй выбрать сертификат — там точно кое-что интересное!</p>
                    </div>
                    <button class="close-btn" onclick="closeModal()">Ладно, поняла!</button>`;
                currentRoseStep = 0;
            }
            openModal(); // Используем единую функцию открытия
        }

        function continueRoseQuest() {
            currentRoseStep++;
            showRoseStep();
        }

        function giveUpRoses() {
            closeModal();
            const giftKeys = ['goldApple', 'photoRainbow', 'manicure', 'ozone', 'wildberries'];
            for (let key of giftKeys) {
                if (!shownGifts.includes(key)) {
                    showGift(key);
                    return;
                }
            }
            showGift('goldApple');
        }

        // ============ ПОДАРКИ ============
        const gifts = {
            goldApple: {
                name: 'Золотое Яблоко',
                code: 'GA-2024-YANA-8842',
                emoji: '💄',
                message: 'Сертификат в Золотое Яблоко! Выбирай самые лучшие бьюти-находки!',
                type: 'code'
            },
            photoRainbow: {
                name: 'Фото радужки глаза',
                emoji: '📸',
                message: 'Сертификат на фото радужки глаза — твой уникальный арт!',
                type: 'image',
                imageSrc: 'cert.jpg' // ИСПРАВЛЕНО: короткое имя файла
            },
            manicure: {
                name: 'Маникюрный салон',
                code: 'NAIL-SPA-YANA-5620',
                emoji: '💅',
                message: 'Сертификат в салон красоты на маникюр!',
                type: 'code'
            },
            ozone: {
                name: 'OZON',
                code: 'OZON-YANA-3108',
                emoji: '📦',
                message: 'Сертификат на OZON — всё, что захочешь!',
                type: 'code'
            },
            wildberries: {
                name: 'Wildberries',
                code: 'WB-YANA-2024',
                emoji: '🛍️',
                message: 'Сертификат на Wildberries — шопинг без границ!',
                type: 'code'
            }
        };

        const giftKeys = ['goldApple', 'photoRainbow', 'manicure', 'ozone', 'wildberries'];
        let shownGifts = [];

        // ============ УПРАВЛЕНИЕ МОДАЛКОЙ ============
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.body.classList.add('no-scroll'); // Блокируем прокрутку фона
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.classList.remove('no-scroll'); // Возвращаем прокрутку
        }

        function showGift(giftKey) {
            if (!shownGifts.includes(giftKey)) {
                shownGifts.push(giftKey);
            }

            const gift = gifts[giftKey];
            const modalContent = document.getElementById('modalContent');
            const remaining = 5 - shownGifts.length;
            const hintText = remaining > 0 ? 'Но это ещё не всё... Закрывай и пробуй другой вариант!' : '';

            let giftContent = '';
            if (gift.type === 'image') {
                giftContent = `<img src="${gift.imageSrc}" alt="Сертификат: ${gift.name}" class="certificate-image">`;
            } else {
                giftContent = `<div class="certificate-code">${gift.code}</div>`;
            }

            modalContent.innerHTML = `
                <div class="modal-icon">${gift.emoji}</div>
                <div class="modal-title">${gift.message}</div>
                ${giftContent}
                ${hintText ? `<p style="color: rgba(255,255,255,0.4); font-size: 0.85em; margin-top: 5px;">${hintText}</p>` : ''}
                <button class="close-btn" onclick="closeModal()">Спасибо!</button>
            `;

            openModal();
            updateChoiceButtons();
        }

        // Закрытие по клику на фон модалки
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function updateChoiceButtons() {
            const optionsContainer = document.getElementById('optionsContainer');
            const choiceQuestion = document.getElementById('choiceQuestion');

            if (shownGifts.length >= 5) {
                choiceQuestion.textContent = '';
                optionsContainer.innerHTML = `
                    <p style="color: #ffd700; font-size: 1.5em; font-weight: 300; letter-spacing: 2px;">
                        Все подарки твои, Яна!
                    </p>`;
            } else {
                choiceQuestion.textContent = 'Что ты выберешь дальше?';
                const nextGiftKey = giftKeys.find(k => !shownGifts.includes(k));
                const nextGift = gifts[nextGiftKey];

                optionsContainer.innerHTML = `
                    <button class="option-btn" onclick="showGift('${nextGiftKey}')">
                        <span class="btn-icon">${nextGift.emoji}</span>
                        <span class="btn-label">Сертификат в ${nextGift.name}</span>
                    </button>
                    <button class="option-btn" onclick="startRoseQuest()">
                        <span class="btn-icon">🌹</span>
                        <span class="btn-label">51 роза</span>
                    </button>`;
            }
        }

        // ============ ЗАПУСК ============
        window.addEventListener('load', () => {
            startSplashFireworks();
            createBalloons();
        });
    </script>
</body>
</html>
