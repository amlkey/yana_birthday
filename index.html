<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 августа... ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Мерцающие частицы */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffd700;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
            box-shadow: 0 0 8px #ffd700, 0 0 16px #ff6b9d;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(2); }
        }

        /* Основной контейнер */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        /* Загадочный заголовок */
        .mystery-text {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 20px;
            animation: fadeInDown 1.5s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-question {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffa07a, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            animation: shimmer 3s infinite, fadeInUp 1.5s ease;
            line-height: 1.3;
        }

        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.4); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Таймер */
        .timer-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 35px 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: inline-block;
            animation: fadeIn 2s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .timer-digits {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .timer-item {
            text-align: center;
            min-width: 80px;
        }

        .timer-number {
            font-size: 4em;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.2);
            line-height: 1;
            font-family: 'Courier New', monospace;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 60px rgba(255, 215, 0, 0.8), 0 0 100px rgba(255, 105, 180, 0.4); }
        }

        .timer-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .timer-separator {
            font-size: 4em;
            font-weight: 900;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
            line-height: 1;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Подсказка внизу */
        .hint {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1em;
            letter-spacing: 2px;
            animation: fadeIn 2.5s ease;
            font-style: italic;
        }

        .hint .emoji {
            font-style: normal;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Свечение по бокам */
        .glow-left, .glow-right {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: moveGlow 6s infinite ease-in-out;
        }

        .glow-left {
            left: -150px;
            top: 30%;
            background: rgba(255, 105, 180, 0.15);
        }

        .glow-right {
            right: -150px;
            top: 50%;
            background: rgba(255, 215, 0, 0.1);
            animation-delay: -3s;
        }

        @keyframes moveGlow {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-50px) scale(1.3); }
        }

        @media (max-width: 600px) {
            .main-question {
                font-size: 1.6em;
            }
            .timer-number {
                font-size: 2.5em;
            }
            .timer-separator {
                font-size: 2.5em;
            }
            .timer-item {
                min-width: 55px;
            }
            .timer-digits {
                gap: 10px;
            }
            .mystery-text {
                font-size: 0.9em;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Свечения -->
    <div class="glow-left"></div>
    <div class="glow-right"></div>

    <!-- Мерцающие частицы -->
    <div class="particles" id="particles"></div>

    <!-- Основной контент -->
    <div class="container">
        <p class="mystery-text">✨ Сохрани эту ссылку ✨</p>
        <h1 class="main-question">
            Что произойдёт<br>8 августа?
        </h1>

        <div class="timer-block">
            <div class="timer-digits">
                <div class="timer-item">
                    <div class="timer-number" id="days">00</div>
                    <div class="timer-label">Дней</div>
                </div>
                <div class="timer-separator">:</div>
                <div class="timer-item">
                    <div class="timer-number" id="hours">00</div>
                    <div class="timer-label">Часов</div>
                </div>
                <div class="timer-separator">:</div>
                <div class="timer-item">
                    <div class="timer-number" id="minutes">00</div>
                    <div class="timer-label">Минут</div>
                </div>
                <div class="timer-separator">:</div>
                <div class="timer-item">
                    <div class="timer-number" id="seconds">00</div>
                    <div class="timer-label">Секунд</div>
                </div>
            </div>
        </div>

        <p class="hint">
            <span class="emoji">🎁</span> Кое-что интересное уже ждёт тебя... <span class="emoji">💝</span>
        </p>
    </div>

    <script>
        // Дата 8 августа текущего года, 00:00:00
        const targetDate = new Date();
        targetDate.setMonth(7); // Август (0-индексация)
        targetDate.setDate(8);
        targetDate.setHours(0, 0, 0, 0);

        // Если 8 августа уже прошло в этом году — ставим на следующий год
        if (targetDate.getTime() < Date.now()) {
            targetDate.setFullYear(targetDate.getFullYear() + 1);
        }

        function updateTimer() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Обновляем каждую секунду
        updateTimer();
        setInterval(updateTimer, 1000);

        // Создаём мерцающие частицы
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 80; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                particle.style.width = (Math.random() * 4 + 2) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
